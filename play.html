<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#f2f0eb">
    <title>Encircling</title>
    <link rel="stylesheet" href="css/play.css">
  </head>
  <body>
    <svg id="board" xmlns="http://www.w3.org/2000/svg">
      <defs id="masks"></defs>
      <g id="world">
        <rect id="paper" x="0" y="0"></rect>
        <g id="fills"></g>
        <g id="lines"></g>
        <g id="draft"></g>
      </g>
    </svg>

    <header id="status">
      <span id="dot"></span>
      <div>
        <div id="who"></div>
        <div id="what"></div>
      </div>
      <button id="menu" type="button" aria-label="New game">New</button>
    </header>

    <footer id="controls">
      <div id="reason" aria-live="polite"></div>
      <div id="buttons">
        <button id="pass" type="button">Pass</button>
        <button id="fit" type="button" aria-label="Show the whole paper">Whole</button>
        <button id="confirm" type="button" disabled>Draw it</button>
      </div>
    </footer>

    <section id="setup" class="overlay" hidden>
      <form id="names">
        <h1>Encircling</h1>
        <p>Name the player for each color. If there are fewer than four of you,
          give someone two colors by typing their name twice.</p>
        <div id="name-fields"></div>
        <button type="submit">Start</button>
        <p class="small">Draw a big circle by dragging out from its center. Drag a circle
          to move it, or its handle to resize it. Pinch to zoom.</p>
      </form>
    </section>

    <section id="handoff" class="overlay" hidden>
      <button id="ready" type="button">
        <span id="handoff-dot"></span>
        <span id="handoff-text"></span>
        <span class="small">Tap when you have the phone</span>
      </button>
    </section>

    <section id="over" class="overlay" hidden>
      <div class="card">
        <h1>Game over</h1>
        <p id="summary"></p>
        <button id="look" type="button">Look at the drawing</button>
        <button id="again" type="button">New game</button>
      </div>
    </section>

    <script src="js/game.js"></script>
    <script src="js/sketch.js"></script>
    <script src="js/play.js"></script>
  </body>
</html>
